        /* Mobile touch optimization */
        body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        #game-container {
            touch-action: manipulation;
        }
        
        /* Prevent iOS Safari bounce effect */
        html, body {
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
